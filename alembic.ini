# Configuración de Alembic para EduAgro (PostgreSQL + Asyncpg)

[alembic]
script_location = alembic
file_template = %%(rev)s_%%(slug)s

# La URL real de la base de datos se inyecta dinámicamente en env.py desde DATABASE_URL
sqlalchemy.url = postgresql+asyncpg://localhost:5432/eduagro

[post_write_hooks]

[loggers]
keys = root,alembic,sqlalchemy

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
