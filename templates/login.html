<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - EduAgro ERP Agropecuario</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            agro: {
              50: '#f0fdf4',
              100: '#dcfce7',
              500: '#22c55e',
              600: '#16a34a',
              700: '#15803d',
              900: '#14532d',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="h-full bg-slate-50 text-slate-800 font-sans antialiased flex flex-col justify-between">

  <!-- Header Superior con Marca del Producto -->
  <header class="bg-white border-b border-slate-200 py-4 px-6 shadow-sm">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-agro-600 flex items-center justify-center text-white font-black text-xl shadow-md">
          🌱
        </div>
        <div>
          <span class="font-black text-2xl tracking-tight text-slate-900">EduAgro</span>
          <span class="text-xs text-agro-700 font-bold ml-2 bg-agro-50 border border-agro-200 px-2.5 py-0.5 rounded-full">
            ERP Agropecuario
          </span>
        </div>
      </div>
      <div class="text-xs text-slate-500 font-medium hidden sm:block">
        Sistema de Gestión Agropecuaria de Córdoba
      </div>
    </div>
  </header>

  <!-- Formulario Principal de Login -->
  <main class="flex-1 flex items-center justify-center p-4">
    <div class="max-w-md w-full space-y-6">

      <!-- Tarjeta de Login -->
      <div class="bg-white rounded-3xl p-8 border border-slate-200 shadow-xl space-y-6">
        
        <div class="text-center space-y-2">
          <h1 class="text-2xl font-black text-slate-900 tracking-tight">Acceso al Sistema</h1>
          <p class="text-xs text-slate-500">
            Ingresa tus credenciales para acceder a la plataforma <strong class="text-agro-700 font-bold">EduAgro</strong>
          </p>

          <div class="pt-1">
            <a href="/descargar-guia" target="_blank" class="inline-flex items-center gap-1.5 px-3.5 py-1.5 bg-emerald-50 hover:bg-emerald-100 text-emerald-800 border border-emerald-300 rounded-full text-xs font-bold transition-all shadow-xs">
              <span>📖</span> <span>Descargar Guía de Usuario (PDF)</span>
            </a>
          </div>
        </div>

        <!-- Alerta de Error de Autenticación -->
        {% if error %}
        <div class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-2xl text-xs font-semibold flex items-center space-x-2">
          <span>⚠️</span>
          <span>{{ error }}</span>
        </div>
        {% endif %}

        <form method="POST" action="/login" class="space-y-4">
          <input type="hidden" name="next" value="{{ next_url or '/' }}" />

          <div>
            <label for="email" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">
              Correo Electrónico
            </label>
            <input
              type="email"
              id="email"
              name="email"
              required
              placeholder="tu.usuario@eduagro.com.ar"
              value="{{ email or '' }}"
              class="w-full bg-slate-50 border border-slate-300 rounded-xl p-3.5 text-sm font-medium text-slate-900 focus:ring-2 focus:ring-agro-500 focus:bg-white focus:outline-none transition-all"
            />
          </div>

          <div>
            <label for="password" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">
              Contraseña
            </label>
            <input
              type="password"
              id="password"
              name="password"
              required
              placeholder="••••••••"
              class="w-full bg-slate-50 border border-slate-300 rounded-xl p-3.5 text-sm font-medium text-slate-900 focus:ring-2 focus:ring-agro-500 focus:bg-white focus:outline-none transition-all"
            />
          </div>

          <button
            type="submit"
            class="w-full py-3.5 bg-agro-600 hover:bg-agro-700 active:scale-[0.99] text-white font-black text-sm rounded-xl shadow-lg shadow-agro-600/30 transition-all cursor-pointer"
          >
            Iniciar Sesión
          </button>
        </form>

      </div>

      </div>

    </div>
  </main>

  <footer class="py-4 text-center text-xs text-slate-400">
    EduAgro ERP Agropecuario • Córdoba, Argentina
  </footer>

</body>
</html>
