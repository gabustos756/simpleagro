<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="isoAgroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="isoGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="isoBadgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#022c22" stop-opacity="0.98"/>
    </linearGradient>
    <filter id="isoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#10b981" flood-opacity="0.4"/>
    </filter>
  </defs>

  <g transform="translate(10, 10)">
    <rect width="140" height="140" rx="36" fill="url(#isoBadgeGrad)" stroke="#10b981" stroke-width="2.5" stroke-opacity="0.4" filter="url(#isoGlow)"/>
    <!-- Surcos de campo -->
    <path d="M 30 115 C 55 90, 75 75, 95 62" fill="none" stroke="#059669" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
    <path d="M 45 122 C 70 98, 88 82, 105 70" fill="none" stroke="#10b981" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
    <path d="M 65 125 C 85 105, 102 90, 115 80" fill="none" stroke="#34d399" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
    <!-- Hoja / Brote estilizado -->
    <path d="M 70 120 C 70 85, 95 55, 108 36 C 108 60, 105 95, 70 120 Z" fill="url(#isoAgroGrad)"/>
    <path d="M 70 120 C 50 100, 48 78, 62 58 C 72 75, 75 95, 70 120 Z" fill="#34d399" opacity="0.85"/>
    <!-- Nodo solar -->
    <circle cx="108" cy="36" r="10" fill="url(#isoGoldGrad)"/>
    <circle cx="108" cy="36" r="5" fill="#ffffff"/>
  </g>
</svg>
