<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 180" width="100%" height="100%">
  <defs>
    <!-- Gradiente para el símbolo principal (Esmeralda a Bosque) -->
    <linearGradient id="agroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Gradiente de acento dorado (Sol y Granos) -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Gradiente de fondo del isotipo -->
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#022c22" stop-opacity="0.98"/>
    </linearGradient>

    <!-- Sombra sutil -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#10b981" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- ISOTIPO (SÍMBOLO: SURCOS DE CAMPO EN PERSPECTIVA + HOJA TECNOLÓGICA + NODO SOLAR) -->
  <g transform="translate(20, 20)">
    <!-- Base redondeada con borde sutil -->
    <rect width="140" height="140" rx="36" fill="url(#badgeGrad)" stroke="#10b981" stroke-width="2.5" stroke-opacity="0.4" filter="url(#glow)"/>

    <!-- Surcos del campo (Líneas de perspectiva agronómica) -->
    <path d="M 30 115 C 55 90, 75 75, 95 62" fill="none" stroke="#059669" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
    <path d="M 45 122 C 70 98, 88 82, 105 70" fill="none" stroke="#10b981" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
    <path d="M 65 125 C 85 105, 102 90, 115 80" fill="none" stroke="#34d399" stroke-width="5" stroke-linecap="round" opacity="0.9"/>

    <!-- Hoja / Brote estilizado vertical central -->
    <path d="M 70 120 C 70 85, 95 55, 108 36 C 108 60, 105 95, 70 120 Z" fill="url(#agroGrad)"/>
    <path d="M 70 120 C 50 100, 48 78, 62 58 C 72 75, 75 95, 70 120 Z" fill="#34d399" opacity="0.85"/>

    <!-- Nodo central (Sol pampeano / Tecnología de precisión) -->
    <circle cx="108" cy="36" r="10" fill="url(#goldGrad)"/>
    <circle cx="108" cy="36" r="5" fill="#ffffff"/>
  </g>

  <!-- LOGOTIPO (TIPOGRAFÍA: "EduAgro") -->
  <g transform="translate(185, 95)">
    <!-- "Edu" en blanco puro contemporáneo -->
    <text x="0" y="0" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="76" font-weight="900" fill="#ffffff" letter-spacing="-2px">
      Edu
    </text>

    <!-- "Agro" en verde esmeralda con gradiente -->
    <text x="135" y="0" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="76" font-weight="900" fill="url(#agroGrad)" letter-spacing="-2px">
      Agro
    </text>

    <!-- Tagline de Producto -->
    <text x="2" y="32" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#94a3b8" letter-spacing="4px">
      GESTIÓN AGROPECUARIA
    </text>

    <!-- Badge Tecnológico -->
    <g transform="translate(325, -55)">
      <rect width="84" height="24" rx="12" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1.5"/>
      <circle cx="14" cy="12" r="4" fill="#34d399"/>
      <text x="26" y="16" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="900" fill="#34d399" letter-spacing="1px">
        PRO
      </text>
    </g>
  </g>
</svg>
